name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest
        env:
          # The end-to-end test clones the demo project and reviews every scenario branch (rules only, no API key).
          DBT_REVIEW_FORK: https://github.com/MartinRajniak/jaffle_shop_duckdb

[project]
name = "dbt-review"
version = "0.1.0"
description = "Reviews dbt model changes: deterministic rules plus an LLM check, for use in CI."
requires-python = ">=3.11"
dependencies = [
    "unidiff>=1.0.1",
]

[project.scripts]
dbt-review = "dbt_review.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "dbt-review"
version = "0.1.0"
description = "Reviews dbt model changes: deterministic rules plus an LLM check, for use in CI."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.3",
    "pydantic-ai-slim[anthropic,groq,openai]>=2.68.0",
    "sqlglot>=30.31.0",
    "unidiff>=1.0.1",
]

[project.scripts]
dbt-review = "dbt_review.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = ["FLY002"]  # expected reports in tests read better as a list of lines

[tool.mypy]
strict = true
files = ["src"]
